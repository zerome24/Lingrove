version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lingrove_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingrove_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingrove_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lingrove}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingrove_user} -d ${POSTGRES_DB:-lingrove}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lingrove_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-lingrove_user}:${POSTGRES_PASSWORD:-lingrove_secure_password_2026}@db:5432/${POSTGRES_DB:-lingrove}
      - JWT_SECRET=${JWT_SECRET:-lingrove_production_super_secret_key_change_me_2026}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost,https://${FRONTEND_DOMAIN:-lingrove.org}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-919059076675}
      - PORT=8000
    volumes:
      - uploads_data:/app/backend/uploads
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  uploads_data:
