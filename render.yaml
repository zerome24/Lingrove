services:
  # Backend API Service
  - type: web
    name: lingrove-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lingrove-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "919059076675"
      - key: CORS_ORIGINS
        value: https://lingrove.vercel.app,https://lingrove.org

  # Frontend Static Site
  - type: static
    name: lingrove-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lingrove-api
          property: host

databases:
  - name: lingrove-postgres
    databaseName: lingrove
    user: lingrove_user
    plan: free
